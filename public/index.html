<head>
  <meta charset="UTF-8" />

  <meta name="description" content="Labto Cooking AI Chatbot - Coming soon." />
  
  <!-- Google Fonts: Montserrat -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900&display=swap" rel="stylesheet" />

    <!-- Google Fonts: Montserrat -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900&display=swap"
      rel="stylesheet"
    />

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="public/favicon.ico" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="coming-soon-container">
    
    <!-- Glowing Emerald Radial Aura -->
    <div class="arch-glow"></div>

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="assests/favicon.ico" />
    <link rel="shortcut icon" type="image/x-icon" href="assests/favicon.ico" />
  </head>
  <body>
    <main class="coming-soon-container">
      <!-- Glowing Emerald Radial Aura -->
      <div class="arch-glow"></div>

      <!-- Arch Dome Card -->
      <div class="arch-dome">
        <!-- Animated Lottie Logo -->
        <div class="lottie-wrapper">
          <div id="lottie-container" class="lottie-box"></div>
        </div>

        <!-- Sweet & Friendly Headline -->
        <h1 class="arch-title">Something delicious is cooking!</h1>

        <!-- Friendly Description -->
        <p class="arch-description">
          Be the first to know when our Labto AI opens the kitchen!
        </p>

        <!-- Email Notification Form -->
        <form id="subscribe-form" class="subscribe-box">
          <div class="input-wrapper">
            <input
              type="email"
              id="email-input"
              placeholder="Enter your email..."
              required
            />
            <button type="submit" class="notify-btn">Notify Me</button>
          </div>
          <div id="form-feedback" class="feedback-msg"></div>
        </form>
      </div>
    </main>

    <!-- Lottie Player Web Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
